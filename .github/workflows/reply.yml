name: Reply to height comments
on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 min (UTC); GitHub may start runs a few minutes late
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what it would reply"
        type: boolean
        default: false
jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node src/run.mjs
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN_2: ${{ secrets.IG_ACCESS_TOKEN_2 }}
          IG_ACCESS_TOKEN_3: ${{ secrets.IG_ACCESS_TOKEN_3 }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
