name: Reply to height comments
on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 min (UTC); GitHub may start runs a few minutes late
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what it would reply"
        type: boolean
        default: false
concurrency:
  group: reply   # never two runs at once, so nobody gets replied to twice
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: run
        run: node src/run.mjs
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN_2: ${{ secrets.IG_ACCESS_TOKEN_2 }}
          IG_ACCESS_TOKEN_3: ${{ secrets.IG_ACCESS_TOKEN_3 }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          ONLY_ACCOUNTS: ""   # empty = reply on every connected account; set e.g. "maverick.pranks" to pause the others
          POSTS: 60      # every post: old reels still get comments
          MAX_PER_RUN: 120   # replies per account per pass (Instagram may pause the account if pushed too hard; the bot then stops that account)
          GAP_MS: 1000       # 1 to 2.2 s between replies
          LOOP_MIN: 20   # stay on for 20 min; the next scheduled run picks up right after
      - name: Save daily stats
        if: always() && inputs.dry_run != true
        run: |
          git config user.name "height-bot"; git config user.email "height-bot@users.noreply.github.com"
          git add stats/ 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -qm "stats $(date -u +%F)"
          # another job (creator detector, a manual push) may have pushed meanwhile: rebase and retry
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep $((i * 5)); done; exit 1
      - name: Keep catching up
        if: steps.run.outputs.capped == 'true'
        run: sleep 90 && gh workflow run reply.yml -R ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
