name: GoPeak creator posts
on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours
  workflow_dispatch:
concurrency: { group: creators-sync, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -U yt-dlp
      - run: python creators/sync.py
        env:
          CP_SYNC_KEY: ${{ secrets.CP_SYNC_KEY }}
